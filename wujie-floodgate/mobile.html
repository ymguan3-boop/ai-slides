<!DOCTYPE html>
<!-- 簡報手機遙控頁（slides-qr-remote 協定：nav／sync，另加 cmd 指令）。與簡報部署在同一資料夾。 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>簡報遙控器｜五結防潮閘門</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif; background: #061019; color: #eaf4f7; min-height: 100vh; padding: 14px 14px 40px; display: flex; flex-direction: column; align-items: center; }
  .wrap { width: 100%; max-width: 420px; }
  .header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
  .header h1 { font-size: 1.15em; color: #3fd0c9; }
  .room { font-size: .7em; color: #6f8b97; }
  .status { font-size: .8em; color: #6f8b97; margin-bottom: 12px; }
  .status.connected { color: #6fd38f; } .status.disconnected { color: #f2b84b; }
  .now { background: #0d202d; border: 1px solid rgba(120,190,210,.25); border-radius: 16px; padding: 14px 16px; margin-bottom: 12px; }
  .now .pg { font-size: .8em; color: #f2b84b; font-weight: 700; }
  .now .tt { font-size: 1.1em; font-weight: 700; margin-top: 4px; line-height: 1.4; }
  .nav { display: flex; gap: 12px; margin-bottom: 12px; }
  .nav button { flex: 1; padding: 22px 0; border: 0; border-radius: 16px; font-size: 1.25em; font-weight: 800; color: #fff; }
  .nav .prev { background: #b9711a; } .nav .next { background: #138a55; }
  .nav button:active { transform: scale(.96); }
  .tools { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
  .tools button { padding: 14px 8px; border-radius: 12px; border: 1px solid rgba(120,190,210,.3); background: #0d202d; color: #eaf4f7; font-size: .95em; font-weight: 600; }
  .tools button.on { background: #12474a; border-color: #3fd0c9; color: #3fd0c9; }
  .tools button:disabled { opacity: .3; }
  .tools button:active:not(:disabled) { transform: scale(.96); }
  .notes { background: #0d202d; border: 1px solid rgba(242,184,75,.35); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; font-size: .92em; line-height: 1.7; color: #f5e7c8; }
  .notes summary { cursor: pointer; color: #f2b84b; font-weight: 700; font-size: .85em; letter-spacing: .08em; }
  .notes p { margin-top: 8px; white-space: pre-line; }
  .list-title { font-size: .75em; color: #6f8b97; margin: 6px 2px; }
  .item { display: flex; gap: 10px; align-items: center; padding: 11px 12px; margin-bottom: 6px; border-radius: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); font-size: .9em; }
  .item .num { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: .8em; font-weight: 700; background: rgba(63,208,201,.18); color: #3fd0c9; }
  .item.active { background: rgba(63,208,201,.16); border-color: rgba(63,208,201,.6); }
  .item.active .num { background: #3fd0c9; color: #052026; }
  .item:active { background: rgba(63,208,201,.25); }
  .model { display: none; background: #0b1a26; border: 1px solid rgba(63,208,201,.45); border-radius: 16px; padding: 12px; margin-bottom: 12px; }
  .model.show { display: block; }
  .model h2 { font-size: .9em; color: #3fd0c9; margin-bottom: 8px; letter-spacing: .06em; }
  .pad { position: relative; height: 170px; border-radius: 14px; background: repeating-linear-gradient(45deg, #0f2633 0 12px, #0d2230 12px 24px); border: 1px dashed rgba(63,208,201,.6); display: grid; place-items: center; color: #6f8b97; font-size: .9em; touch-action: none; user-select: none; -webkit-user-select: none; margin-bottom: 8px; }
  .pad.drag { border-style: solid; color: #3fd0c9; }
  .zoomrow { display: flex; gap: 8px; margin-bottom: 10px; }
  .zoomrow button { flex: 1; padding: 12px 0; border-radius: 12px; border: 1px solid rgba(120,190,210,.3); background: #0d202d; color: #eaf4f7; font-size: 1.05em; font-weight: 700; }
  .mgrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .mgrid .lbl { grid-column: 1 / -1; font-size: .72em; color: #6f8b97; margin-top: 4px; }
  .mgrid button { padding: 11px 4px; border-radius: 10px; border: 1px solid rgba(120,190,210,.3); background: #0d202d; color: #eaf4f7; font-size: .85em; font-weight: 600; }
  .mgrid button:active, .zoomrow button:active { background: #12474a; }
  .live { position: relative; aspect-ratio: 16 / 9; border-radius: 14px; overflow: hidden; background: #000; border: 1px solid rgba(63,208,201,.6); touch-action: none; user-select: none; -webkit-user-select: none; margin-bottom: 8px; }
  .live img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .live .hint2 { position: absolute; left: 0; right: 0; bottom: 0; padding: 4px 8px; font-size: .72em; color: #a9c1cb; background: linear-gradient(transparent, rgba(0,0,0,.75)); pointer-events: none; }
  .live .wait { position: absolute; inset: 0; display: grid; place-items: center; color: #6f8b97; font-size: .85em; pointer-events: none; }
  .live.drag { border-color: #f2b84b; }
  .closebtn { width: 100%; padding: 13px 0; margin-bottom: 10px; border-radius: 12px; border: 1px solid #ff6b5e; background: rgba(255,107,94,.14); color: #ffb3ab; font-size: 1em; font-weight: 800; }
  .drone { display: none; margin: 4px 0 10px; padding: 12px; border-radius: 14px; background: #10202b; border: 1px solid #f2b84b; }
  .drone.show { display: block; }
  .drone h3 { font-size: .85em; color: #f2b84b; margin-bottom: 8px; }
  .dpad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .dpad button, .dvert button { padding: 16px 0; border-radius: 12px; border: 1px solid rgba(242,184,75,.5); background: #1b2a33; color: #fff; font-size: 1.05em; font-weight: 800; touch-action: none; user-select: none; -webkit-user-select: none; }
  .dpad button.on, .dvert button.on { background: #6b4e12; }
  .dvert { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .dpad .sp { visibility: hidden; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>📱 簡報遙控器</h1><div class="room" id="room"></div></div>
  <div class="status" id="status">連線中…</div>
  <div class="now"><div class="pg" id="pg">- / -</div><div class="tt" id="tt">等待簡報…</div></div>
  <div class="nav"><button class="prev" data-c="prev">◀ 上一步</button><button class="next" data-c="next">下一步 ▶</button></div>
  <div class="tools">
    <button id="bPlay" data-c="play" disabled>▶ 影片 播放／暫停</button>
    <button id="bRestart" data-c="restart" disabled>⟲ 影片 從頭</button>
    <button id="bCc" data-c="cc" disabled>字幕 開／關</button>
    <button id="bNotes" data-c="notes">講者備註（投影）</button>
    <button id="bHelp" data-c="help">H 說明</button>
    <button id="bMotion" data-c="motion">減少動態</button>
    <button id="bCalc" data-c="calc" style="display:none;grid-column:1/-1">AI 輔助參數 開／關</button>
  </div>
  <div class="model" id="modelBox">
    <h2 id="modelTitle">🧭 3D 模型操作</h2>
    <div class="live" id="live"><img id="liveImg" alt=""><div class="wait" id="liveWait">連線後顯示模型即時畫面…</div><div class="hint2">拖曳：旋轉　輕點：點選畫面位置</div></div>
    <button class="closebtn" id="bClose">✕ 關閉模型彈窗</button>
    <div class="drone" id="drone"><h3>🚁 無人機控制器（按住移動）</h3>
      <div class="dpad"><span class="sp"></span><button data-k="ArrowUp">▲ 前進</button><span class="sp"></span><button data-k="ArrowLeft">◀ 左轉</button><button data-k="ArrowDown">▼ 後退</button><button data-k="ArrowRight">右轉 ▶</button></div>
      <div class="dvert"><button data-k="KeyE">⤒ 上升</button><button data-k="KeyQ">⤓ 下降</button></div>
    </div>
    <div class="zoomrow"><button data-z="1">＋ 放大</button><button data-z="-1">－ 縮小</button></div>
    <div class="mgrid" id="mgrid"></div>
  </div>
  <details class="notes" id="notesBox" open><summary>本頁講稿（只在手機顯示）</summary><p id="script">—</p></details>
  <div class="list-title">點選頁面可直接跳頁</div>
  <div id="list"></div>
</div>

<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<script>
  const ABLY_KEY = 'y9S__A.igJ5VQ:OI-7oLz4u4V4NdOoTRK90nUxJLhPo5s6KpQxKnWdFdc';
  const room = new URLSearchParams(location.search).get('room') || 'unknown';
  document.getElementById('room').textContent = room;
  const $ = (id) => document.getElementById(id);
  let notes = [], total = 17, cur = 0, hostOnline = false, ch = null, client = null, idleTimer = null;
  const IDLE = 10 * 60 * 1000;

  function setStatus(t, c) { const e = $('status'); e.textContent = t; e.className = 'status' + (c ? ' ' + c : ''); }
  function resetIdle() { clearTimeout(idleTimer); idleTimer = setTimeout(() => { setStatus('⏱ 閒置逾 10 分鐘，已自動斷線', 'disconnected'); leave(); }, IDLE); }
  function leave() { try { ch.presence.leave(); } catch (e) {} try { client.close(); } catch (e) {} }

  function render(s) {
    if (s) { cur = s.h; total = s.total || total; }
    $('pg').textContent = (cur + 1) + ' / ' + total + (s && s.steps ? '　（逐步 ' + s.step + '/' + s.steps + '）' : '');
    const n = notes[cur];
    $('tt').textContent = n ? n.title : '第 ' + (cur + 1) + ' 頁';
    $('script').textContent = n ? n.script + (n.points.length ? '\n' + n.points.map((p) => '・' + p).join('\n') : '') : '—';
    document.querySelectorAll('.item').forEach((e, i) => e.classList.toggle('active', i === cur));
    if (s) {
      for (const id of ['bPlay', 'bRestart', 'bCc']) $(id).disabled = !s.film;
      $('bPlay').textContent = s.playing ? '❚❚ 影片 暫停' : '▶ 影片 播放';
      $('bCc').classList.toggle('on', !!(s.film && s.cc));
      $('bNotes').classList.toggle('on', !!s.notes); $('bHelp').classList.toggle('on', !!s.help); $('bMotion').classList.toggle('on', !!s.reduced); $('bMotion').textContent = s.reduced ? '已關閉進場、轉場動畫' : '減少動態';
      renderModel(s.model);
      $('bCalc').style.display = s.calc ? '' : 'none'; $('bCalc').classList.toggle('on', !!s.calcOpen); $('bCalc').textContent = s.calcOpen ? 'AI 輔助參數（已開啟，點此關閉）' : 'AI 輔助參數 開啟';
    }
  }
  function buildList() {
    const L = $('list'); L.innerHTML = '';
    for (let i = 0; i < total; i++) {
      const d = document.createElement('div'); d.className = 'item';
      d.innerHTML = '<div class="num">' + (i + 1) + '</div><div></div>'; d.lastChild.textContent = notes[i] ? notes[i].title : '第 ' + (i + 1) + ' 頁';
      d.onclick = () => { if (ch) { ch.publish('nav', { h: i }); cur = i; render(); resetIdle(); } };
      L.appendChild(d);
    }
  }
  document.querySelectorAll('[data-c]').forEach((b) => b.onclick = () => { if (ch) { ch.publish('cmd', { c: b.dataset.c }); resetIdle(); if (navigator.vibrate) navigator.vibrate(15); } });

  // ---- 3D 模型操作（指令轉給簡報，由簡報操作模型自身按鈕） ----
  const MODEL_UI = {
    risk: { title: '🧭 3D 淹水風險主模型', groups: [
      ['工程條件', [['施作前', { t: 'btn', label: '切換工程施作前' }], ['施作後', { t: 'btn', label: '切換工程施作後' }]]],
      ['Q10 流量情境', [['775 一般治理', { t: 'btn', label: 'Q10一般治理775 cms' }], ['750 關閘禦潮', { t: 'btn', label: 'Q10關閘禦潮750 cms' }], ['1088 目標年', { t: 'btn', label: 'Q10目標年1088 cms' }]]],
      ['評估年份', [['現況 2020', { t: 'sel', label: '選擇洪峰流量評估年份', value: 'BASE_2020' }], ['目標年 2070', { t: 'sel', label: '選擇洪峰流量評估年份', value: 'TARGET_2070' }]]],
      ['視角與展示', [['閘門近景', { t: 'btn', label: '閘門近景' }], ['垂直俯視', { t: 'btn', label: '垂直俯視' }], ['降雨情景', { t: 'btn', label: '播放強降雨情景（假設）' }], ['自由瀏覽', { t: 'btn', label: '啟用自由瀏覽' }], ['退出自由瀏覽', { t: 'btn', label: '退出自由瀏覽' }], ['收合工具列', { t: 'btn', label: '收合工具列內容' }]]],
    ] },
    audit: { title: '🧭 查核證據 3D 模型', groups: [
      ['視角', [['區域', { t: 'btn', label: '區域' }], ['斜視', { t: 'btn', label: '斜視' }], ['俯視', { t: 'btn', label: '俯視' }], ['閘門', { t: 'btn', label: '閘門' }], ['聚落', { t: 'btn', label: '聚落' }], ['無人機', { t: 'btn', label: '無人機' }]]],
      ['風險查核點', [['？1 內外水', { t: 'cp', i: 0 }], ['？2 堤岸餘裕', { t: 'cp', i: 1 }], ['？3 越波', { t: 'cp', i: 2 }], ['？4 多門失效', { t: 'cp', i: 3 }], ['？5 抽水依賴', { t: 'cp', i: 4 }], ['關閉分析卡', { t: 'btn', label: '關閉風險分析卡' }]]],
      ['面板', [['查核點明細', { t: 'btn', label: '風險查核點明細' }], ['關閉明細', { t: 'btn', label: '關閉風險查核點明細' }], ['操作說明', { t: 'btn', label: '本模型操作說明' }]]],
    ] },
  };
  let modelNow = null;
  const sendModel = (mm) => { if (ch) { ch.publish('cmd', { c: 'model', m: mm }); resetIdle(); if (navigator.vibrate) navigator.vibrate(10); } };
  function renderModel(kind) {
    if (kind === modelNow) return; modelNow = kind;
    const box = $('modelBox'); box.classList.toggle('show', !!kind); $('drone').classList.remove('show'); $('liveImg').removeAttribute('src'); $('liveWait').style.display = ''; if (!kind) return;
    const ui = MODEL_UI[kind]; $('modelTitle').textContent = ui.title; const g = $('mgrid'); g.innerHTML = '';
    for (const [lbl, items] of ui.groups) {
      const l = document.createElement('div'); l.className = 'lbl'; l.textContent = lbl; g.appendChild(l);
      for (const [text, cmd] of items) { const b = document.createElement('button'); b.textContent = text; b.onclick = () => { sendModel(cmd); if (kind === 'audit' && lbl === '視角') $('drone').classList.toggle('show', text === '無人機'); }; g.appendChild(b); }
    }
  }
  document.querySelectorAll('[data-z]').forEach((b) => b.onclick = () => sendModel({ t: 'zoom', dir: +b.dataset.z }));
  (() => { // 即時畫面：拖曳 → 旋轉（每 120ms 累積送出）；輕點 → 點選同位置
    const pad = $('live'); let last = null, start = null, moved = 0, acc = [0, 0], timer = null;
    const flush = () => { if (Math.abs(acc[0]) + Math.abs(acc[1]) > 2) sendModel({ t: 'rot', dx: Math.round(acc[0] * 2.4), dy: Math.round(acc[1] * 2.4) }); acc = [0, 0]; };
    pad.addEventListener('pointerdown', (e) => { last = start = [e.clientX, e.clientY]; moved = 0; pad.classList.add('drag'); pad.setPointerCapture(e.pointerId); timer = setInterval(flush, 120); });
    pad.addEventListener('pointermove', (e) => { if (!last) return; const dx = e.clientX - last[0], dy = e.clientY - last[1]; acc[0] += dx; acc[1] += dy; moved += Math.abs(dx) + Math.abs(dy); last = [e.clientX, e.clientY]; });
    const end = (e) => {
      if (!last) return; last = null; pad.classList.remove('drag'); clearInterval(timer);
      if (moved < 8) { const r = pad.getBoundingClientRect(); acc = [0, 0]; sendModel({ t: 'tap', x: (start[0] - r.left) / r.width, y: (start[1] - r.top) / r.height }); } else flush();
    };
    pad.addEventListener('pointerup', end); pad.addEventListener('pointercancel', end);
  })();
  $('bClose').onclick = () => sendModel({ t: 'close' });
  document.querySelectorAll('[data-k]').forEach((b) => { // 無人機：按住持續送出，放開即停
    let t = null; const code = b.dataset.k;
    const down = (e) => { e.preventDefault(); if (t) return; b.classList.add('on'); const send = () => ch && ch.publish('cmd', { c: 'model', m: { t: 'key', code, down: true } }); send(); t = setInterval(send, 300); if (navigator.vibrate) navigator.vibrate(10); };
    const up = () => { if (!t) return; clearInterval(t); t = null; b.classList.remove('on'); if (ch) ch.publish('cmd', { c: 'model', m: { t: 'key', code, down: false } }); };
    b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
  });

  fetch('speaker-notes.json').then((r) => r.json()).then((j) => { notes = j; total = j.length; buildList(); render(); }).catch(() => { buildList(); });

  function setHost(on) { hostOnline = on; if (!on) { setStatus('✖ 簡報已關閉，已斷線', 'disconnected'); leave(); } }
  try {
    client = new Ably.Realtime({ key: ABLY_KEY, clientId: 'mobile-' + Date.now() });
    ch = client.channels.get('slide-remote-' + room);
    ch.subscribe('frame', (m) => { if (m.data && m.data.img && modelNow) { $('liveImg').src = m.data.img; $('liveWait').style.display = 'none'; } });
    ch.subscribe('sync', (m) => { if (m.data && typeof m.data.h === 'number') { render(m.data); resetIdle(); } });
    ch.presence.subscribe('enter', (m) => { if (m.clientId && m.clientId.indexOf('host-') === 0) { setHost(true); resetIdle(); } });
    ch.presence.subscribe('leave', (m) => { if (m.clientId && m.clientId.indexOf('host-') === 0) setHost(false); });
    client.connection.on('connected', () => {
      setStatus('✅ 已連線', 'connected'); try { ch.presence.enter(); } catch (e) {} resetIdle();
      ch.presence.get((err, members) => { if (err) return; const hosts = members.filter((x) => x.clientId && x.clientId.indexOf('host-') === 0); if (hosts.length) { hostOnline = true; ch.publish('cmd', { c: 'noop' }); } else setStatus('⚠️ 找不到簡報，請確認簡報已開啟並重新掃 QR', 'disconnected'); });
    });
    client.connection.on('connecting', () => setStatus('⏳ 連線中…'));
    client.connection.on('disconnected', () => setStatus('⚠️ 連線中斷，重連中…', 'disconnected'));
    client.connection.on('suspended', () => setStatus('⛔ 連線已暫停', 'disconnected'));
    client.connection.on('closed', () => setStatus('✖ 連線已關閉', 'disconnected'));
    client.connection.on('failed', () => setStatus('❌ 連線失敗', 'disconnected'));
  } catch (e) { setStatus('❌ ' + e.message, 'disconnected'); }
  buildList(); render();
</script>
</body>
</html>
